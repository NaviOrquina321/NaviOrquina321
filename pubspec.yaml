name: doctor_appointment_app
description: "Production-quality Doctor Appointment Scheduler Flutter Application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  sqflite: ^2.4.2+1
  path: ^1.9.1
  sqflite_common_ffi: ^2.4.0+3
  intl: ^0.19.0
  crypto: ^3.0.6
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.1.4
  file_picker: ^8.1.3
  connectivity_plus: ^6.0.5
  permission_handler: ^11.3.1
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image_picker: ^1.1.2

dependency_overrides:
  image: 4.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_icon.png"
  adaptive_icon_monochrome: "assets/images/logo_mono.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo_icon.png
  android_12:
    color: "#FFFFFF"
    image: assets/images/logo_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
